  - url: >-
      https://www.businesswire.com/news/home/20230926705189/en/Leafly-Announces-New-API-for-Order-Integration
    type: Announcement
  description: >-
    Order (Reservations) API that lets any cannabis POS provider integrate Leafly online orders into its
    own system, taking ownership of the order integration rather than relying on a bespoke Leafly-built
    connector. Launched in beta in 2023, it requires the retailer to already run V2 of the Menu Integration
    API. The full API reference is published via ReDoc at docs.leafly.io/reservations-api/order-api/ but
    the machine-readable specification sits behind Cloudflare Access, so endpoint-level detail is only
    available to onboarded partners - endpoints here are documented at the capability level rather than
    modeled into a local OpenAPI, to avoid fabricating a surface. Contact partners@leafly.com for access.
